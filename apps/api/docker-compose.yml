# Local Postgres for the Destow backend.
# Drizzle migrations own the schema — no init SQL is mounted.
# Ports avoid the host's postgresql@18 (5433) and the conventional 5432.
#
#   Full stack: docker compose up -d --build        → API on localhost:3000 + DB
#   Dev DB only: docker compose up -d db             → localhost:5434/destow
#   Test DB:     docker compose --profile test up -d db-test → localhost:5435/destow_test
#   Stop:        docker compose down                 (add -v to wipe the dev volume)
name: destow

services:
  # API container (Bun + Express) — local testing only; prod runs the same code on a VPS/ECS.
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: destow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://destow:destow_local@db:5432/destow
      REDIS_URL: redis://redis:6379
      # OTP HMAC secret (token signing uses an Ed25519 keypair; dev auto-generates one).
      JWT_SECRET: local_dev_jwt_secret_at_least_32_characters_long
      AWS_REGION: ap-south-1
      CORS_ORIGINS: "*"
      # Local-only affordances. The image now defaults to NODE_ENV=production and
      # every one of these defaults to off, so a deployed environment that sets
      # none of them fails closed. They must never appear in a deployed config.
      # (docker-compose.override.yml supplies a real keypair on top of this, so the
      # ephemeral branch is only reached by `make observability`, which skips the
      # override via explicit -f flags.)
      ALLOW_EPHEMERAL_JWT_KEYS: "true"
      ALLOW_WILDCARD_CORS: "true"
      OTP_DEV_ECHO: "true"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: destow-dev
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    # No host port — the gateway is the only public entry point.

  # Gateway (Caddy) — every request enters here and is proxied to the API.
  gateway:
    image: caddy:2-alpine
    container_name: destow-gateway
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80" # all API traffic enters here (mobile emulator: 10.0.2.2:3000)
      # - "443:443" # prod HTTPS with the Destow domain
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - destow_caddy:/data

  db:
    image: postgres:16-alpine
    container_name: destow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: destow
      POSTGRES_PASSWORD: destow_local
      POSTGRES_DB: destow
    ports:
      - "5434:5432"
    volumes:
      - destow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U destow -d destow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Isolated, ephemeral DB for integration tests (data on tmpfs → fast, wiped on restart).
  db-test:
    image: postgres:16-alpine
    container_name: destow-db-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: destow
      POSTGRES_PASSWORD: destow_local
      POSTGRES_DB: destow_test
    ports:
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U destow -d destow_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis — real-time pub/sub + cache (used from the real-time phase).
  redis:
    image: redis:7-alpine
    container_name: destow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO — S3-compatible object storage for KYC docs / vehicle photos (dev).
  minio:
    image: minio/minio
    container_name: destow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - destow_minio:/data

volumes:
  destow_pgdata:
  destow_minio:
  destow_caddy:
