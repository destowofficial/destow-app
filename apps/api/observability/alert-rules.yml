groups:
  - name: destow-api
    rules:
      - alert: DestowApiMetricsDown
        expr: up{job="destow-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Destow API metrics target is down
          description: Prometheus cannot scrape the API /metrics endpoint.

      - alert: DestowApiHealthCheckFailing
        expr: probe_success{job=~".*api-health"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Destow API health check is failing
          description: Blackbox exporter cannot get a 2xx response from the API health endpoint.

      - alert: DestowHighErrorRate
        expr: |
          sum(rate(destow_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(destow_http_requests_total[5m])), 1)
          > 0.02
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: Destow API 5xx rate is above 2%
          description: More than 2% of API responses are 5xx over the last 5 minutes.

      - alert: DestowHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(destow_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: Destow API p95 latency is above 1 second
          description: API p95 request latency has stayed above 1 second for 10 minutes.

  - name: host
    rules:
      - alert: HostDiskAlmostFull
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: Host disk has less than 15% free space
          description: Free disk space is below 15%. Backups, Docker images, or logs may fill the disk soon.

      - alert: HostMemoryPressure
        expr: |
          (
            node_memory_MemAvailable_bytes
            /
            node_memory_MemTotal_bytes
          ) < 0.10
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: Host memory is under pressure
          description: Available memory is below 10% for 10 minutes.

  - name: containers
    rules:
      - alert: ContainerCpuHigh
        expr: |
          sum by (name) (
            rate(container_cpu_usage_seconds_total{name!=""}[5m])
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: Container CPU usage is high
          description: A container has used more than 85% CPU for 10 minutes.

      - alert: ContainerMemoryHigh
        expr: |
          sum by (name) (
            container_memory_working_set_bytes{name!=""}
          ) > 1500000000
        for: 10m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: Container memory usage is high
          description: A container is using more than 1.5 GB of working-set memory.
