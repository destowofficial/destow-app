groups:
  - name: destow-api
    rules:
      - alert: DestowApiMetricsDown
        expr: up{job="destow-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Destow API metrics target is down
          description: Prometheus cannot scrape the API /metrics endpoint.

      - alert: DestowApiHealthCheckFailing
        expr: probe_success{job=~".*api-health"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: Destow API health check is failing
          description: Blackbox exporter cannot get a 2xx response from the API health endpoint.

      - alert: DestowHighErrorRate
        expr: |
          sum(rate(destow_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(destow_http_requests_total[5m])), 1)
          > 0.02
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: Destow API 5xx rate is above 2%
          description: More than 2% of API responses are 5xx over the last 5 minutes.

      - alert: DestowHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(destow_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: Destow API p95 latency is above 1 second
          description: API p95 request latency has stayed above 1 second for 10 minutes.

      - alert: DestowOtpVerifyFailureRateHigh
        expr: |
          sum(rate(destow_auth_events_total{event="otp_verify",result=~"error|blocked"}[5m]))
          /
          clamp_min(sum(rate(destow_auth_events_total{event="otp_verify"}[5m])), 1)
          > 0.25
        for: 5m
        labels:
          severity: warning
          service: auth
        annotations:
          summary: Destow OTP verification failure rate is high
          description: More than 25% of OTP verification events are failing or blocked.

      - alert: DestowSmsProviderFailing
        expr: sum(rate(destow_external_requests_total{operation="send_otp",result="error"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: auth
        annotations:
          summary: Destow SMS provider calls are failing
          description: OTP SMS delivery provider calls have failed in the last 5 minutes.

      - alert: DestowRedisErrors
        expr: sum(rate(destow_redis_commands_total{result="error"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: Destow Redis commands are failing
          description: Redis is failing API commands used for rate limits or auth denylist checks.

      - alert: DestowPostgresErrors
        expr: sum(rate(destow_db_queries_total{result="error"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: Destow Postgres operations are failing
          description: Database operations observed by the API are returning errors.

      - alert: DestowPaymentFailures
        expr: sum(rate(destow_payment_events_total{result=~"failed|error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: payments
        annotations:
          summary: Destow payment failures detected
          description: Payment provider events are returning failed or error results.
