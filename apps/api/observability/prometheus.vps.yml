global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production
    app: destow

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: destow-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:3000

  - job_name: public-api-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # Replace with the production API domain.
          - https://api.destow.com/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
