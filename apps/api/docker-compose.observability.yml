# Lightweight open-source observability add-on for the Destow backend.
#
# Local:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#   Grafana:    http://localhost:3001
#   Prometheus: http://localhost:9090
#
# VPS:
#   Use the same file with docker-compose.prod.yml. Keep ports bound to 127.0.0.1
#   and reach Grafana through SSH tunneling or a protected Caddy vhost.
#
# Optional env overrides:
#   PROMETHEUS_CONFIG=./observability/prometheus.vps.yml
#   GRAFANA_ADMIN_USER=admin
#   GRAFANA_ADMIN_PASSWORD=<strong password>
#   GRAFANA_PORT=3001
#   PROMETHEUS_PORT=9090

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: destow-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ${PROMETHEUS_CONFIG:-./observability/prometheus.local.yml}:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - destow_prometheus:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: destow-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - destow_alertmanager:/alertmanager

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: destow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-destow_admin_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - destow_grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: destow-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

volumes:
  destow_prometheus:
  destow_alertmanager:
  destow_grafana:
