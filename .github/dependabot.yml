version: 2
# Continuous complement to the CI `bun audit` gate: Dependabot opens PRs when a
# dependency gets a new advisory or a version bump. Uses the `bun` ecosystem so
# it updates bun.lock too — with the `npm` ecosystem it would bump package.json
# without touching bun.lock, and those PRs would fail `bun install --frozen-lockfile`.
updates:
  - package-ecosystem: "bun"
    # Single root entry: bun.lock lives only at the repo root and covers every
    # workspace (apps/*, packages/*). Per-subdir entries would look for a lock
    # that isn't there.
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # One grouped PR for routine minor/patch bumps (less noise); majors and
      # security fixes still come as their own PRs.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Hold back breaking majors we migrate deliberately, not via a bot:
      # zod 3 -> 4 and TypeScript's new native compiler (7.x) both need code work.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Batch action bumps into one PR instead of one-per-action.
      github-actions:
        patterns: ["*"]
