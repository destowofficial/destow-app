name: Mobile

# Expo / React Native checks. The Expo version check guards against
# reintroducing the native-module version mismatch that caused the startup
# crash (e.g. a stray gesture-handler/reanimated/screens bump).
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'bun.lock', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', 'bun.lock', '.github/workflows/mobile.yml']

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Expo version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/mobile
        run: bunx tsc --noEmit
      - name: Expo dependency compatibility
        working-directory: apps/mobile
        run: bun expo install --check
