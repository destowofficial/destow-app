name: Dependency audit

# Whole-monorepo vulnerability audit. Triggers on ANY dependency change (a
# manifest in any workspace, or the lockfile) so backend AND mobile deps are
# always scanned. `bun audit` reads the single bun.lock and covers every
# workspace, so a high/critical in a mobile dep fails the build too.
on:
  push:
    branches: [main]
    paths: ['**/package.json', 'bun.lock', '.github/workflows/audit.yml']
  pull_request:
    paths: ['**/package.json', 'bun.lock', '.github/workflows/audit.yml']

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: bun audit (all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Report all advisories (informational)
        run: bun audit || true
      # image-size is unpatched, not out of date, and there is no version to
      # move to: the advisories cover <=2.0.2 and 2.0.2 is the newest release,
      # so every published version is inside the range. An override cannot help
      # - it picks from what exists. Metro is the only thing that pulls it, and
      # every metro from 0.84 to 0.87 requires ^1.0.2, so a bump does not clear
      # it either. GitHub reports first_patched_version: null on both.
      #
      # The exposure is a hung parser on a malformed ICNS, JXL or HEIF file,
      # reached at bundle time over assets committed to this repo - so getting
      # there means a hostile image is already in our source tree.
      #
      # Excused by advisory ID, never by severity: every other high still fails
      # the build, including any future advisory against image-size itself.
      # Delete these two lines as soon as a patched release ships.
      - name: Fail on high/critical advisories
        run: |
          bun audit --audit-level=high \
            --ignore=GHSA-w3rx-r6r6-pgpr \
            --ignore=GHSA-5p2g-fcmc-qvqq
