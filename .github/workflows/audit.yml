name: Dependency audit

# Whole-monorepo vulnerability audit. Triggers on ANY dependency change (a
# manifest in any workspace, or the lockfile) so backend AND mobile deps are
# always scanned. `bun audit` reads the single bun.lock and covers every
# workspace, so a high/critical in a mobile dep fails the build too.
on:
  push:
    branches: [main]
    paths: ['**/package.json', 'bun.lock', '.github/workflows/audit.yml']
  pull_request:
    paths: ['**/package.json', 'bun.lock', '.github/workflows/audit.yml']

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: bun audit (all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Report all advisories (informational)
        run: bun audit || true
      - name: Fail on high/critical advisories
        run: bun audit --audit-level=high
