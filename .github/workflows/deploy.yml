name: Build & Publish API image

# Replaces the old Lambda/CloudFormation pipeline (the backend moved to Bun on
# VPS/ECS - Lambda can't hold WebSocket connections). On every push to main this
# builds the production image from apps/api/Dockerfile and publishes it to GHCR.
# The actual rollout step is a documented TODO below - wire it once the target
# host/cluster + secrets exist.
on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/contracts/**', 'bun.lock', 'apps/api/Dockerfile']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TODO deploy: once the target exists, add a step to roll out the new image.
      #  - VPS:  ssh in, `docker compose pull && docker compose up -d`
      #  - ECS:  `aws ecs update-service --force-new-deployment` (image from ECR;
      #          swap the GHCR login/push above for ECR if you go this route)
