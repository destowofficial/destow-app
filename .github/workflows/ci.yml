name: CI

# Runs on every backend PR and on pushes to main. Gates merges on typecheck,
# unit + integration tests, and a dependency vulnerability audit.
on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/contracts/**', 'bun.lock', '.github/workflows/ci.yml']
  pull_request:
    paths: ['apps/api/**', 'packages/contracts/**', 'bun.lock', '.github/workflows/ci.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: destow
          POSTGRES_PASSWORD: destow_local
          POSTGRES_DB: destow_test
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U destow -d destow_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/api
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        working-directory: apps/api
        run: bun test
      - name: Integration tests (Postgres + Redis)
        working-directory: apps/api
        run: bun run test:integration

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Report all advisories (informational)
        run: bun audit || true
      - name: Fail on high/critical advisories
        run: bun audit --audit-level=high
